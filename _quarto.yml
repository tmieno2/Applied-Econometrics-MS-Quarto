project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!assignments/"
    - "!lectures/00-Introduction/self-introduction.qmd"
    - "!exams/"
    - "!research-flow/"

website:
  title: "Applied Econometrics (AECN 896-004)"
  open-graph: true # https://quarto.org/docs/websites/website-tools.html#open-graph
  page-footer: "Made with Quarto"
  # sidebar:
  #   style: "docked"
  #   search: true
  #   contents:
  #     - text: "Univariate Regression"
  #       href: lectures/01-univariate-introduction/univariate_regression_x.qmd
  navbar:
    right:
      - text: Syllabus
        href: syllabus.qmd
      - text: Schedule
        href: schedule.qmd
      - text: Lecture Notes
        href: lectures/index.qmd
      - text: Lecture Notes (R Lab)
        href: LabLectures.qmd
      - text: Assignments
        href: assignments.qmd
      # - text: Slides
      #   menu:
      #     - text: 01 - Univariate Regression
      #       href: lectures/univariate/univariate_regression_x.rmd
format:
  html:
    # Pinned, and the trailing slash matters: Quarto concatenates the filename
    # onto this url, so ".../dist" would emit ".../distkatex.min.js" and every
    # equation would silently stay unrendered. See _lecture-shared/RULES.md.
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/"
    theme: [cosmo, styles.scss]
