<!-- quarto-webr loads Monaco's AMD loader (define.amd). KaTeX ships UMD and
     registers as an anonymous AMD module instead of setting window.katex, so
     Quarto's inline renderer throws "katex is not defined" on every WebR deck.
     Import the ESM build, which ignores AMD, and publish the global before
     DOMContentLoaded so the stock renderer finds it. -->
<script type="module">
  import katex from "https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.mjs";
  window.katex = window.katex || katex;
</script>
