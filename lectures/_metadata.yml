# Shared plot sizing for lecture notes. Individual figures can still override
# these defaults when their layout requires a different aspect ratio or width.
execute:
  fig-width: 7
  fig-height: 4.5
  fig-dpi: 216
  out-width: 55%

webr:
  cell-options:
    dpi: 216
    fig-width: 7
    fig-height: 4.5
    out-width: 55%
